name: htpc
services:
  plex:
    image: plexinc/pms-docker:latest
    hostname: plex
    container_name: plex
    restart: unless-stopped
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    volumes:
      - ./config/plex_db:/config
      - ./config/plex_transcode:/transcode
      # NAS Drive for content
      - /media:/data
    environment:
      TZ: Asia/Kolkata
    env_file: ./vars.env # For private variables

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    hostname: jellyfin
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./config/jellyfin/data:/config
      # Jellyfin only needs read access; Sonarr and Radarr manage the library.
      - /media:/data:ro
    # Expose the Intel iGPU for Quick Sync/VA-API hardware transcoding.
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
      - 7359:7359/udp
    restart: unless-stopped

  tunarr:
    image: ghcr.io/chrisbenincasa/tunarr:latest
    container_name: tunarr
    environment:
      - TUNARR_LOG_LEVEL=info
      - TZ=Asia/Kolkata
    volumes:
      - ./config/tunarr/data:/config/tunarr
      # Use the same path as Jellyfin so Tunarr can stream library files
      # directly without path replacement rules.
      - /media:/data:ro
    # Expose the Intel iGPU for VA-API/Quick Sync channel transcoding.
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8000:8000
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config/qbittorrent/appdata:/config
      # A common /data mount keeps download and library paths consistent across
      # qBittorrent, Sonarr, and Radarr and permits hardlinks when the host
      # directories are on the same filesystem.
      - /media:/data
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./config/sonarr/data:/config
      - /media:/data
      # Compatibility alias for existing library root folders.
      - /media/TV:/tv
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./config/radarr/data:/config
      - /media:/data
      # Compatibility alias for existing library root folders.
      - /media/Movies:/movies
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./config/prowlarr/data:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
      - PORT=5055
    volumes:
      - ./config/seerr/data:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Asia/Kolkata
    # FlareSolverr has no authentication. Keep it private to this Compose network;
    # Prowlarr or Jackett can reach it at http://flaresolverr:8191.
    expose:
      - 8191
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - AUTO_UPDATE=false
      # - RUN_OPTS= #optional
    volumes:
      - ./config/jackett/data:/config
    ports:
      - 9117:9117
    depends_on:
      flaresolverr:
        condition: service_healthy
    restart: unless-stopped
